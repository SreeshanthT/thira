[workspace]
resolver = "3"
members = ["app", "crates/*"]
exclude = ["spikes"]
default-members = ["app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/SreeshanthT/thira"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
# Dependencies (including FFmpeg and wgpu wrappers later) are slow unoptimized.
opt-level = 2
