name: Feature request
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [PRD](https://github.com/SreeshanthT/thira/blob/main/docs/PRD.md) first. Features listed as non-goals (such as advanced color grading, audio mixing or AI features) will not be considered before v1.0.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: prd-ref
    attributes:
      label: Related PRD requirement
      placeholder: TL-7
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
