name: Viewer spike

# Measures both viewer approaches from issue #2 on every OS. Not a required check:
# runners have no real GPU, so numbers are software-rendered and only indicative.
on:
  workflow_dispatch:
  pull_request:
    paths: ["spikes/viewer/**", ".github/workflows/spike-viewer.yml"]

permissions:
  contents: read

jobs:
  measure:
    name: Viewer spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/viewer
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies (WebKitGTK, virtual display, software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev xvfb mesa-vulkan-drivers imagemagick

      - name: Start virtual display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/viewer

      - run: cargo build --release

      - name: Run both modes
        run: |
          bin=target/release/thira-viewer-spike
          [ "$RUNNER_OS" = Windows ] && bin="$bin.exe"
          screenshot() {
            case "$RUNNER_OS" in
              Linux) import -window root "$1" ;;
              macOS) screencapture -x "$1" ;;
              Windows) powershell -NoProfile -Command "Add-Type -AssemblyName System.Drawing, System.Windows.Forms; \$b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$i = New-Object System.Drawing.Bitmap \$b.Width, \$b.Height; [System.Drawing.Graphics]::FromImage(\$i).CopyFromScreen(\$b.Location, [System.Drawing.Point]::Empty, \$b.Size); \$i.Save('$1')" ;;
            esac
          }
          for mode in transfer native; do
            echo "::group::$mode"
            # perl's alarm gives a portable timeout on every runner.
            THIRA_SPIKE_MODE=$mode THIRA_SPIKE_FRAMES=120 THIRA_SPIKE_HOLD_MS=10000 \
              THIRA_SPIKE_OUT="result-$mode.json" perl -e 'alarm shift; exec @ARGV' 180 "$bin" &
            pid=$!
            # Native mode holds its last frame for 10 s after ~4-6 s of rendering;
            # transfer mode is mid-run at this point. Both shots show what is on screen.
            sleep 9 && screenshot "shot-$mode.png" || echo "screenshot failed"
            wait $pid || echo "$mode exited with $?"
            cat "result-$mode.json" 2>/dev/null || echo "{\"mode\": \"$mode\", \"error\": \"no result\"}" > "result-$mode.json"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: viewer-spike-${{ matrix.os }}
          path: |
            spikes/viewer/result-*.json
            spikes/viewer/shot-*.png
