name: FFmpeg (LGPL)

# Builds the LGPL 2.1+ shared FFmpeg that Thira links dynamically (PRD section
# 10, issue #13): the same commit and the same policy on every OS.
#
# - --disable-autodetect: nothing is linked just because a runner has it; only
#   the features listed per platform are enabled.
# - No --enable-gpl, --enable-nonfree or --enable-version3: checked in config.h.
# - Linux is built on Ubuntu 22.04 (the PRD minimum); Windows is cross-compiled
#   there with mingw-w64 and gets MSVC import libraries; macOS is built for arm64
#   and x86_64 with a macOS 12 minimum.
# - Each package also carries the Rust bindings (binding.rs) for its platform,
#   generated on a native runner (.github/ffmpeg-bindgen), so building Thira
#   needs no libclang.
#
# Pull requests that change this file build and verify only. Run it manually on
# main with `publish` to create the `ffmpeg-<version>-<revision>` release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages as a GitHub release
        type: boolean
        default: false
  pull_request:
    paths: [".github/workflows/ffmpeg.yml", ".github/ffmpeg-bindgen/**"]

permissions:
  contents: read

env:
  FFMPEG_VERSION: "8.1.3"
  # release/8.1 at n8.1.3-29.
  FFMPEG_COMMIT: ad3b795b72388fbb2b216e1e6fd38fba994e1df0
  # Bump the revision for a new package of the same FFmpeg (1 was the
  # `ffmpeg-8.1.3` release, without bindings). Must match scripts/fetch-ffmpeg.mjs.
  PACKAGE: ffmpeg-8.1.3-2
  COMMON_FLAGS: >-
    --enable-shared --disable-static --disable-autodetect
    --disable-doc --disable-debug --disable-network --enable-zlib

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            flags: --enable-pthreads
          - platform: windows-x64
            os: ubuntu-22.04
            flags: >-
              --enable-cross-compile --arch=x86_64 --target-os=mingw32
              --cross-prefix=x86_64-w64-mingw32- --enable-w32threads
              --enable-mediafoundation --enable-d3d11va --enable-dxva2
              --extra-ldflags=-static-libgcc
          - platform: macos-arm64
            os: macos-latest
            arch: arm64
            flags: --enable-pthreads --enable-videotoolbox --enable-audiotoolbox
          - platform: macos-x64
            os: macos-latest
            arch: x86_64
            flags: >-
              --enable-cross-compile --arch=x86_64 --target-os=darwin
              --enable-pthreads --enable-videotoolbox --enable-audiotoolbox
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set the install directory
        run: echo "DEST=$GITHUB_WORKSPACE/$PACKAGE-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config zlib1g-dev
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            sudo apt-get install -y mingw-w64 libz-mingw-w64-dev llvm
            # Link zlib statically: without its DLL import library the linker
            # uses libz.a, so no zlib1.dll has to ship with FFmpeg.
            sudo rm -f /usr/x86_64-w64-mingw32/lib/libz.dll.a
          fi

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config

      # With the release tag in the history, FFmpeg's `git describe` gives a
      # version like n8.1.3-29-gad3b795b72 instead of a bare commit hash.
      - name: Fetch FFmpeg source at the pinned commit
        run: |
          mkdir src && cd src
          git init -q
          git fetch -q --depth 64 https://github.com/FFmpeg/FFmpeg.git "$FFMPEG_COMMIT" \
            "refs/tags/n$FFMPEG_VERSION:refs/tags/n$FFMPEG_VERSION"
          git checkout -q "$FFMPEG_COMMIT"
          git describe --tags

      - name: Configure
        working-directory: src
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ]; then
            mac="-arch ${{ matrix.arch }} -mmacosx-version-min=12.0"
            extra=(--cc="clang -arch ${{ matrix.arch }}" --extra-cflags="$mac" --extra-ldflags="$mac"
                   --extra-ldexeflags="-Wl,-rpath,@executable_path/../lib" --install-name-dir=@rpath)
          fi
          # shellcheck disable=SC2086 # flags are deliberately word-split
          ./configure --prefix="$DEST" $COMMON_FLAGS ${{ matrix.flags }} "${extra[@]}" \
            || { tail -50 ffbuild/config.log; exit 1; }

      - name: Check the license is LGPL 2.1+
        working-directory: src
        run: |
          grep -E '^#define CONFIG_(GPL|NONFREE|VERSION3) ' config.h | tee flags.txt
          [ "$(wc -l < flags.txt)" -eq 3 ]
          if grep -qE ' 1$' flags.txt; then
            echo "::error::GPL, non-free or (L)GPLv3 enabled"; exit 1
          fi

      - name: Build
        working-directory: src
        run: make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)" && make install

      - name: Add MSVC import libraries (Windows)
        if: matrix.platform == 'windows-x64'
        run: |
          # Rust on Windows links with MSVC, which needs .lib import libraries;
          # mingw installs .def files we can turn into them.
          cd "$DEST/lib"
          for def in *.def; do
            name="${def%-*}"              # avcodec-62.def -> avcodec
            llvm-dlltool -m i386:x86-64 -d "$def" -l "$name.lib" -D "${def%.def}.dll"
          done
          ls -la

      - name: Check Windows DLLs need only system libraries
        if: matrix.platform == 'windows-x64'
        run: |
          x86_64-w64-mingw32-objdump -p "$DEST"/bin/*.dll | grep "DLL Name" | sort -u | tee imports.txt
          if grep -iE 'libgcc|libwinpthread|libstdc|zlib' imports.txt; then
            echo "::error::DLL depends on a non-system runtime"; exit 1
          fi

      - name: Package
        run: |
          cp src/COPYING.LGPLv2.1 "$DEST/LICENSE.txt"
          grep '^#define FFMPEG_CONFIGURATION' src/config.h > "$DEST/BUILDCONF.txt"
          printf 'Source: https://github.com/FFmpeg/FFmpeg/tree/%s\nBuilt by the Thira "FFmpeg (LGPL)" workflow.\n' \
            "$FFMPEG_COMMIT" > "$DEST/SOURCE.txt"
          tar -czf "$(basename "$DEST").tar.gz" -C "$(dirname "$DEST")" "$(basename "$DEST")"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: ffmpeg-*.tar.gz

  bindings:
    name: Bindings ${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.platform }}

      - name: Generate binding.rs
        run: |
          tar -xzf ffmpeg-*.tar.gz
          name="$PACKAGE-${{ matrix.platform }}"
          dir="$PWD/$name"
          if [ "$RUNNER_OS" = Windows ]; then dir=$(cygpath -m "$dir"); fi
          FFMPEG_INCLUDE_DIR="$dir/include" FFMPEG_LIBS_DIR="$dir/lib" FFMPEG_LINK_MODE=dynamic \
            cargo build --locked --manifest-path .github/ffmpeg-bindgen/Cargo.toml \
            --target ${{ matrix.target }} --target-dir "$RUNNER_TEMP/bindgen"
          cp "$RUNNER_TEMP"/bindgen/${{ matrix.target }}/debug/build/rusty_ffmpeg-*/out/binding.rs "$dir/"
          # bindgen 0.71 with a new libclang emitted FFmpeg structs without fields.
          grep -A2 "pub struct AVFormatContext {" "$dir/binding.rs" | grep -q "pub av_class"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ${{ env.PACKAGE }}-${{ matrix.platform }}.tar.gz

  verify:
    name: Verify ${{ matrix.platform }}
    needs: bindings
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-22.04 }
          - { platform: windows-x64, os: windows-latest }
          - { platform: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.platform }}
      - name: Run ffmpeg and ffprobe from the package
        run: |
          tar -xzf ffmpeg-*.tar.gz
          dir="$PACKAGE-${{ matrix.platform }}"
          test -s "$dir/binding.rs"
          export LD_LIBRARY_PATH="$PWD/$dir/lib"
          "$dir/bin/ffmpeg" -hide_banner -version | head -1 | tee version.txt
          grep -q "version n$FFMPEG_VERSION" version.txt
          "$dir/bin/ffmpeg" -hide_banner -L > license.txt
          cat license.txt
          # The notice wraps across lines (CRLF on Windows); join them before matching.
          tr -d '\r' < license.txt | tr '\n' ' ' | grep -q "Lesser General Public License .*version 2.1"
          "$dir/bin/ffprobe" -hide_banner -version | head -3
          # Encode a short test clip and probe it, to prove the libraries work.
          "$dir/bin/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=25:duration=1 \
            -c:v mpeg4 test.mkv
          "$dir/bin/ffprobe" -hide_banner -loglevel error -show_entries stream=codec_name,width,height \
            -of csv=p=0 test.mkv | tee probe.txt
          grep -q "mpeg4,320,180" probe.txt

  publish:
    name: Publish release
    needs: [bindings, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ffmpeg-*.tar.gz | tee SHA256SUMS
          gh release create "$PACKAGE" --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg $FFMPEG_VERSION (LGPL 2.1+, shared), package ${PACKAGE##*-}" \
            --notes "LGPL 2.1+ shared FFmpeg $FFMPEG_VERSION for Thira, built by the FFmpeg (LGPL) workflow from https://github.com/FFmpeg/FFmpeg/tree/$FFMPEG_COMMIT with no GPL, non-free or version3 options. Each package contains LICENSE.txt, SOURCE.txt, BUILDCONF.txt and the platform's Rust bindings (binding.rs)." \
            ffmpeg-*.tar.gz SHA256SUMS
