# Where rusty_ffmpeg (under thira-media) finds the LGPL FFmpeg downloaded by
# `pnpm ffmpeg:fetch` (scripts/fetch-ffmpeg.mjs, which pins the package).
# The package's pregenerated bindings are used, so no libclang is needed.
# Variables already set in the environment take precedence.
[env]
FFMPEG_BINDING_PATH = { value = "third_party/ffmpeg/8.1.3-2/binding.rs", relative = true }
FFMPEG_LIBS_DIR = { value = "third_party/ffmpeg/8.1.3-2/lib", relative = true }
FFMPEG_LINK_MODE = "dynamic"
