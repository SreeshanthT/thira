[package]
name = "thira-store"
description = "SQLite project files for Thira: schema, migrations and atomic saves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
thira-model = { path = "../thira-model" }
thiserror = "2.0.21"
uuid = "1.29.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

[[bench]]
name = "store"
harness = false

[lints]
workspace = true
